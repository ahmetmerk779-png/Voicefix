plugins {
    id 'net.fabricmc.fabric-loom' version '1.14.10'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { maven { url = "https://maven.fabricmc.net/" }; mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}
def generatedNativeResources = layout.buildDirectory.dir("generated/voicefix-resources")
sourceSets.main.resources.srcDir(generatedNativeResources)
tasks.register("buildAndroidArm64Native", Exec) {
    def ndk = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_LATEST_HOME")
    if (ndk == null) throw new GradleException("Android NDK not found. Set ANDROID_NDK_HOME (NDK 27.2+).")
    def hostTag = org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "darwin-x86_64" : "linux-x86_64"
    def clang = file("${ndk}/toolchains/llvm/prebuilt/${hostTag}/bin/aarch64-linux-android26-clang")
    def output = generatedNativeResources.get().file("natives/arm64-v8a/libaudioshim.so").asFile
    doFirst {
        output.parentFile.mkdirs()
        if (!clang.exists()) throw new GradleException("ARM64 Android NDK compiler not found: ${clang}")
    }
    commandLine clang.absolutePath, "-shared", "-fPIC", "-O2", "-Wall", "-Wextra",
        "-I${System.getProperty("java.home")}/include",
        "-I${System.getProperty("java.home")}/include/linux",
        file("native/audio_bridge.c").absolutePath, "-o", output.absolutePath,
        "-ldl", "-lOpenSLES", "-llog", "-landroid"
    inputs.file("native/audio_bridge.c")
    outputs.file(output)
}
tasks.named("processResources") {
    dependsOn("buildAndroidArm64Native")
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = "UTF-8" }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }
